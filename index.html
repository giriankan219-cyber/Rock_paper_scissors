<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="Stylesheet" href="game.css">
</head>
<body>
    <div class="game_name">
        <h3>Rock Papers Scissors</h3>
    </div>
    <div class="images">
        <div>
            <img src="Rock.jpeg" alt="Rock" class="choice" id="rock">
        </div>
        <div>
            <img src="paper.jpeg" alt="Paper" class="choice" id="paper">
        </div>
        <div>
           <img src="Scissors.jpeg" alt="Scissors" class="choice" id="scissors">
        </div>
    </div>
    <div class="score">
        <div>
            <p class="user_score">0</p>
            <h2 class="user">Your score</h2>
        </div>
        <div class="computer_score">
            <p class="comp_score">0</p>
            <h2 class="comp">Computer score</h2>
        </div>
    </div>
    <button class="btn">Let's start the game</button>
   <button class="btn" id="restart">Restart Game</button>
   <button class="btn" id="mode">Click to swith dark mode</button>
    <script src="game.js"></script>
</body>
</html>
